name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project and Build APK
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi

          PROJECT_ROOT=$(find . -maxdepth 3 \( -name "settings.gradle*" -o -name "build.gradle*" \) -not -path "*/app/*" -printf '%h\n' | head -n 1)
          cd "$PROJECT_ROOT"
          chmod +x gradlew 2>/dev/null || true

          set +e
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon > build_log.txt 2>&1
          else
            gradle assembleDebug --stacktrace --no-daemon > build_log.txt 2>&1
          fi
          BUILD_STATUS=$?

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "## ❌ আসল কোড এরর:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -B 1 -A 5 "e: " build_log.txt >> $GITHUB_STEP_SUMMARY \vert{}\vert{} tail -n 35 build_log.txt >>$GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_log.txt
            exit $BUILD_STATUS
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
