name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Locate Project and Build APK
        run: |
          echo "=== Root directory contents ==="
          ls -la

          # যদি জিপ ফাইল আপলোড করা থাকে তবে তা আনজিপ করবে
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Zip file found, extracting..."
            unzip -o *.zip
          fi

          # settings.gradle বা build.gradle যে ফোল্ডারে আছে তা খুঁজে বের করা
          PROJECT_ROOT=$(find . -maxdepth 3 \( -name "settings.gradle*" -o -name "build.gradle*" \) -not -path "*/app/*" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::রিপোজিটরিতে কোনো Gradle বিল্ড ফাইল পাওয়া যায়নি!"
            echo "বর্তমান ফাইল ও ফোল্ডারের তালিকা:"
            find . -maxdepth 3
            exit 1
          fi

          echo "Found project directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # gradlew ফাইল থাকলে তা ব্যবহার করবে, অন্যথায় গ্লোবাল gradle দিয়ে বিল্ড করবে
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
