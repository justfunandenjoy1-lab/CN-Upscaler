name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project and Build APK
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting zip file..."
            unzip -o *.zip
          fi

          PROJECT_ROOT=$(find . -maxdepth 3 \( -name "settings.gradle*" -o -name "build.gradle*" \) -not -path "*/app/*" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Gradle বিল্ড ফাইল পাওয়া যায়নি!"
            exit 1
          fi

          echo "Found project directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
